  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:linear-gradient(170deg,var(--bg2),var(--bg1));color:#fff;font-family:var(--font);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;

.stat{display:flex;gap:6px;align-items:center;font-size:15px}
.pill{background:#ffffff22;border-radius:999px;padding:5px 12px;white-space:nowrap;font-size:15px}
button.pill{border:0;color:#fff;font-family:inherit;cursor:pointer;box-shadow:0 3px 0 #00000040}
button.pill:active{transform:translateY(2px);box-shadow:0 1px 0 #00000040}
.mission{background:var(--card);color:var(--card-ink);border-radius:18px;padding:12px 16px;font-size:19px;line-height:1.35;box-shadow:0 5px 0 #00000040;min-height:54px;display:flex;align-items:center}
.mission b{color:#d6479a;font-weight:400}
#field{position:relative;flex:1;min-height:0;border-radius:22px;background:radial-gradient(ellipse at 50% 30%,#6a4ccf55,#00000022);box-shadow:inset 0 0 0 3px #ffffff22}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;border-radius:22px}
#hud{position:absolute;left:12px;top:10px;display:flex;gap:8px;align-items:center;font-size:14px;pointer-events:none}
#hud .pill{padding:3px 10px;font-size:14px}#stars{color:#ffe14d;letter-spacing:2px}
#toast{position:absolute;left:12px;right:12px;top:44px;text-align:center;font-size:16px;color:#fff;text-shadow:0 2px 0 #0006;pointer-events:none;transition:opacity .3s;opacity:0}
#credit{position:absolute;right:12px;bottom:8px;max-width:calc(50% - 20px);text-align:right;line-height:1.35;font-size:11px;opacity:.55;pointer-events:none;letter-spacing:.3px;text-shadow:0 1px 0 #0006}
#lvl .credit{font-size:11px;opacity:.55;text-align:center}
#legend{position:absolute;left:12px;bottom:10px;display:flex;flex-direction:column;gap:3px;font-size:12px;opacity:.9;pointer-events:none}#legend div{display:flex;align-items:center;gap:6px}#legend i{width:11px;height:11px;border-radius:50%;display:inline-block;border:2px solid #ffffff88}
#win[hidden]{display:none}
#win{position:absolute;inset:auto 14px 14px 14px;background:var(--card);color:var(--card-ink);border-radius:20px;padding:14px 16px;text-align:center;box-shadow:0 6px 0 #00000050;display:flex;flex-direction:column;gap:6px;align-items:center}
#win .big{font-size:26px;color:#2f9f6a}#win .eq{font-size:22px}#win .st{font-size:26px;color:#f2a60c;letter-spacing:4px}
button{font-family:inherit;border:0;cursor:pointer;color:inherit}
#next{margin-top:4px;background:#3fd28c;color:#06361f;font-size:20px;padding:10px 28px;border-radius:14px;box-shadow:0 4px 0 #1f8a5a}
#next:active{transform:translateY(3px);box-shadow:0 1px 0 #1f8a5a}
#eq{background:#00000033;border-radius:16px;padding:8px 14px;text-align:center;font-size:30px;letter-spacing:1px;min-height:46px;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;box-shadow:inset 0 0 0 2px #ffffff22}
#eq .num{display:inline-block;min-width:1ch;transition:color .2s,transform .2s}#eq .chg{color:#ffe14d;transform:scale(1.12)}#eq .op{opacity:.8}#eq .res{color:#8cffc0}#eq .bad{color:#ffb070}#eq .xl{width:100%;display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap;font-size:.74em;opacity:.95}#eq .xl .sp{width:10px}#eq small{display:block;width:100%;font-size:15px;opacity:.85;letter-spacing:0}
nav{display:flex;gap:10px;padding-bottom:2px}
.tool{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--tool);border-radius:16px;padding:12px 8px;font-size:18px;box-shadow:0 4px 0 #00000040}
.tool svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.tool:active{transform:translateY(3px);box-shadow:0 1px 0 #00000040}
.mission{justify-content:space-between;gap:10px}.mission>span{flex:1;min-width:0}
.spk{flex:0 0 auto;width:42px;height:42px;border-radius:50%;background:#ffe14d;color:#3a2a00;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 0 #b8941a}
.spk svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}.spk:active{transform:translateY(2px);box-shadow:0 1px 0 #b8941a}

.sep{font-size:26px;opacity:.7}.ci{display:inline-block;border-radius:50%;background:#2fa36b;box-shadow:inset 0 -4px 0 #00000026;position:relative}.ci.big{width:44px;height:44px}.ci.small{width:22px;height:22px}.ok::after{content:"";position:absolute;right:-8px;top:-10px;width:18px;height:18px;border-radius:50%;background:#ffe14d;box-shadow:0 2px 0 #b8941a}
button.pill[aria-pressed="true"]{background:#ffe14d;color:#3a2a00}
#lvl .play{grid-column:1/-1;background:linear-gradient(#fff6e6,#ffe9b8)}
#lvl[hidden]{display:none}
#lvl{position:fixed;inset:0;z-index:20;background:linear-gradient(170deg,var(--bg2),var(--bg1));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px max(16px,env(safe-area-inset-left,0px));box-sizing:border-box;overflow:auto}
#lvl h2{margin:0;font-weight:400;font-size:26px;color:#d9ffe9;text-align:center}
#lvl .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;width:min(520px,100%)}
.lv{background:var(--card);color:var(--card-ink);border-radius:20px;padding:14px 12px;text-align:center;box-shadow:0 5px 0 #00000050;display:flex;flex-direction:column;gap:6px;align-items:center}
.lv:active{transform:translateY(3px);box-shadow:0 2px 0 #00000050}
.lv .dot{width:34px;height:34px;border-radius:50%;box-shadow:inset 0 -4px 0 #00000026}
.lv b{font-weight:400;font-size:22px}.lv span{font-size:14px;line-height:1.3;opacity:.85}
.lv[aria-current="true"]{outline:4px solid #ffe14d}
:focus-visible{outline:3px solid #fff;outline-offset:2px}

header{grid-area:hd}.mission{grid-area:ms}#field{grid-area:fld}#eq{grid-area:eqa}nav{grid-area:nv}

}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
