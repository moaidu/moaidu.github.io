   '<label class="lb">슬라임 색</label><div class="swr" id="pf-hues">'+HUES.map(function(h){return '<button class="sw'+(h===150?' on':'')+'" data-h="'+h+'" style="background:hsl('+h+',70%,55%)" aria-label="color"></button>'}).join('')+'</div>'+
