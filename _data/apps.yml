# 만든 앱 목록. 앱을 추가할 때는 항목 하나만 더한다.
# status: 준비 중 / 시험 공개 중 / 공개 중
- id: godeungeodi
  name: 고등어디
  icon: /assets/img/apps/godeungeodi.png
  tagline: 고등학교, 어디 갈까요?
  status: 시험 공개 중
  why: 우리 아이가 갈 수 있는 고등학교를 찾다가 너무 답답해서 만들었어요. 과학고, 외고, 국제고는 대체 어디지? 이 궁금증에서 시작했습니다. (정작 저희 집에선 쓸 일이 없었다는 게 함정이에요.)
  for: 초·중등 학부모. 초등 때부터 미리 알아 두고 싶은 분도, 지금 고민이 한창인 중등 학부모도 쓸 수 있어요.
  url: /godeungeodi/
  button: 고등어디 열기
  note: 학교 정보는 바뀔 수 있어요. 지원 전에는 꼭 각 학교와 교육청의 공식 모집요강을 다시 확인해 주세요.
- id: ipak
  name: 초등 첫걸음
  icon: /assets/img/favicon.svg
  tagline: 초등 입학, 생각보다 괜찮아요
  status: 시험 공개 중
  why: 아이 초등학교 입학이 다가오면 뭘 언제 해야 하는지, 한글은 어디까지 해야 하는지 걱정이 한꺼번에 몰려와요. 그 막막함을 순서대로 정리했습니다.
  for: 초등학교 입학을 앞둔 학부모. 시기별 할 일, 걱정별 답, 우리 아이 준비도 점검, 준비물 체크를 한곳에서 볼 수 있어요.
  url: /ipak/
  button: 초등 첫걸음 열기
  note: 일정과 절차는 지역·학교마다 달라요. 취학통지서와 학교 공지를 꼭 함께 확인해 주세요.
- id: slime
  name: 넘버 슬라임
  icon: /assets/img/apps/slime.svg
  tagline: 슬라임을 자르고 합치며 수 감각을 깨워요
  status: 시험 공개 중
  why: 수는 외우기 전에 만져 봐야 한다고 생각했어요. 슬라임을 쭉 늘려 떼고, 서로 합치고, 통에 넣고 빼다 보면 덧셈, 뺄셈, 곱셈, 나눗셈이 저절로 눈에 보이는 놀이를 만들었어요.
  for: 유아부터 초등 3학년까지. 글을 읽지 못해도 손으로 하며 수를 느낄 수 있고, 학년이 올라가면 식과 자릿값까지 이어져요. 한국어와 영어로 볼 수 있어요.
  url: /slime/play/
  button: 슬라임 놀이터 열기
  note: 전체 레벨(1~4단계 미션)은 <a href="/slime/">여기</a>에서 해 볼 수 있어요. © 2026 @cool.coolbro · 무단 복제·배포 금지
