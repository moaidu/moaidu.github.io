<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>불멍 · 모닥불 멍때리기</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:system-ui,sans-serif}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0}
  .ui{position:fixed;left:0;right:0;bottom:16px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:0 12px;transition:opacity .8s}
  .ui.hide{opacity:0;pointer-events:none}
  .ui button,.ui a{background:rgba(20,12,8,.8);color:#f0cfa8;border:1px solid #6a442a;border-radius:20px;padding:8px 14px;cursor:pointer;font-size:14px;text-decoration:none}
  .ui button.on{background:#a8531f;color:#fff}
</style>
</head>
<body>
<iframe id="v" allow="autoplay; encrypted-media; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>
<div class="ui" id="ui"></div>
<script>
const VIDEOS=[
  {id:'gCo9XUi5208',name:'🏕 시골 캠프파이어'},
  {id:'1Ep1hm2wICY',name:'❄️ 겨울밤 모닥불'},
  {id:'o6vTLrQpyzo',name:'🌊 강가 모닥불'},
  {id:'ml-qIJPGnEo',name:'🇳🇴 노르웨이 모닥불'}
];
const v=document.getElementById('v'),ui=document.getElementById('ui');
function play(i){
  const x=VIDEOS[i];
  v.src=`https://www.youtube.com/embed/${x.id}?autoplay=1&mute=0&controls=0&loop=1&playlist=${x.id}&rel=0&modestbranding=1&playsinline=1`;
  [...ui.querySelectorAll('button')].forEach((b,j)=>b.classList.toggle('on',i===j));
  ui.querySelector('a').href='https://www.youtube.com/watch?v='+x.id;
  try{localStorage.setItem('bulmeong',i)}catch(e){}
}
VIDEOS.forEach((x,i)=>{const b=document.createElement('button');b.textContent=x.name;b.onclick=()=>play(i);ui.appendChild(b)});
const a=document.createElement('a');a.target='_blank';a.rel='noopener';a.textContent='YouTube에서 열기 ↗';ui.appendChild(a);
let s=0;try{s=+localStorage.getItem('bulmeong')||0}catch(e){}
play(VIDEOS[s]?s:0);
let t;function show(){ui.classList.remove('hide');clearTimeout(t);t=setTimeout(()=>ui.classList.add('hide'),4000)}
['mousemove','touchstart','click','keydown'].forEach(e=>addEventListener(e,show));show();
</script>
</body>
</html>
