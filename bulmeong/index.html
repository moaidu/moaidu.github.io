<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>불멍 · 모닥불 멍때리기</title>
<style>
  html,body{margin:0;height:100%;background:#0b0705;overflow:hidden;font-family:system-ui,sans-serif}
  canvas{display:block;width:100%;height:100%}
  .ui{position:fixed;left:0;right:0;bottom:18px;text-align:center;color:#c9a27a;font-size:14px;opacity:.7;transition:opacity 1s}
  .ui button{background:#2a1a10;color:#e9c39b;border:1px solid #5a3a22;border-radius:20px;padding:8px 16px;margin:0 4px;cursor:pointer;font-size:14px}
  .ui.hide{opacity:0;pointer-events:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="ui" id="ui">
  <button id="snd">🔊 타닥타닥 소리</button>
  <button id="wood">🪵 장작 추가</button>
</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H,U;function rs(){const d=devicePixelRatio||1;W=cv.width=innerWidth*d;H=cv.height=innerHeight*d;U=Math.min(W,H)/600}rs();addEventListener('resize',rs);
let P=[],S=[],M=[],fuel=1,T=0;
const R=(a,b)=>a+Math.random()*(b-a);
const stars=Array.from({length:70},()=>({x:Math.random(),y:Math.random()*.6,r:R(.4,1.4),p:R(0,6)}));
function spawn(){
  const n=Math.round(14*fuel);
  for(let i=0;i<n;i++){
    const w=70*U*fuel;
    P.push({x:W/2+R(-w,w)*R(.2,1),y:H*.8-R(0,10)*U,vy:-R(1.8,4.2)*U*(.6+fuel*.5),ph:R(0,6.28),life:1,d:R(.011,.02),r:R(14,30)*U*(.7+fuel*.4)});
  }
  if(Math.random()<.05*fuel)S.push({x:W/2+R(-50,50)*U,y:H*.74,vx:R(-1.2,1.2)*U,vy:-R(3,6)*U,life:1});
  if(Math.random()<.25)M.push({x:W/2+R(-40,40)*U,y:H*.5,vy:-R(.6,1.2)*U,life:1,r:R(20,40)*U});
}
function logs(){
  const cx=W/2,cy=H*.8;
  ctx.save();ctx.translate(cx,cy);ctx.scale(U,U);
  const lg=(x,y,a,l)=>{ctx.save();ctx.translate(x,y);ctx.rotate(a);
    const g=ctx.createLinearGradient(0,-14,0,14);g.addColorStop(0,'#5a3a22');g.addColorStop(.5,'#3a2314');g.addColorStop(1,'#1c0f08');
    ctx.fillStyle=g;ctx.beginPath();ctx.roundRect(-l/2,-14,l,28,14);ctx.fill();
    ctx.fillStyle='#e8803a';ctx.globalAlpha=.55*fuel;ctx.beginPath();ctx.ellipse(l/2-8,0,5,10,0,0,7);ctx.fill();ctx.globalAlpha=1;ctx.restore()};
  lg(-45,14,.32,150);lg(45,14,-.32,150);lg(0,24,0,170);
  ctx.restore();
}
function draw(){
  T+=.016;ctx.globalCompositeOperation='source-over';
  ctx.fillStyle='#0a0604';ctx.fillRect(0,0,W,H);
  stars.forEach(s=>{ctx.fillStyle=`rgba(255,240,220,${.25+.2*Math.sin(T*2+s.p)})`;ctx.fillRect(s.x*W,s.y*H,s.r*U*1.5,s.r*U*1.5)});
  const fl=1+.06*Math.sin(T*9)+.04*Math.sin(T*23);
  const g=ctx.createRadialGradient(W/2,H*.72,10,W/2,H*.72,420*U*fuel*fl);
  g.addColorStop(0,`rgba(255,130,40,${.38*fuel})`);g.addColorStop(.5,`rgba(150,50,10,${.15*fuel})`);g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // ground
  const gg=ctx.createLinearGradient(0,H*.82,0,H);gg.addColorStop(0,'#150c07');gg.addColorStop(1,'#050302');
  ctx.fillStyle=gg;ctx.fillRect(0,H*.82,W,H*.18);
  logs();
  spawn();
  // smoke
  for(let i=M.length-1;i>=0;i--){const m=M[i];m.y+=m.vy;m.x+=Math.sin(T*2+i)*.5*U;m.life-=.006;m.r+=.25*U;
    if(m.life<=0){M.splice(i,1);continue}
    ctx.fillStyle=`rgba(90,80,75,${.035*m.life})`;ctx.beginPath();ctx.arc(m.x,m.y,m.r,0,7);ctx.fill()}
  ctx.globalCompositeOperation='lighter';
  for(let i=P.length-1;i>=0;i--){
    const p=P[i];p.life-=p.d;if(p.life<=0){P.splice(i,1);continue}
    p.y+=p.vy;
    p.x+=(W/2-p.x)*.018+Math.sin(T*6+p.ph+p.y*.02)*1.3*U;
    const l=p.life,r=p.r*(.35+l*.9);
    const gr=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,r);
    gr.addColorStop(0,`rgba(255,${230*l+25|0},${140*l*l|0},${.55*l})`);
    gr.addColorStop(.5,`rgba(255,${110*l+20|0},20,${.35*l})`);
    gr.addColorStop(1,'rgba(200,30,0,0)');
    ctx.fillStyle=gr;ctx.beginPath();ctx.ellipse(p.x,p.y,r*.75,r*1.35,0,0,7);ctx.fill();
  }
  for(let i=S.length-1;i>=0;i--){
    const s=S[i];s.x+=s.vx+Math.sin(T*8+i)*.4;s.y+=s.vy;s.vy+=.05*U;s.life-=.01;
    if(s.life<=0){S.splice(i,1);continue}
    ctx.fillStyle=`rgba(255,${160+80*s.life|0},80,${s.life})`;ctx.beginPath();ctx.arc(s.x,s.y,2.2*U*s.life+.5,0,7);ctx.fill();
  }
  fuel=Math.max(.5,fuel-.0002);
  requestAnimationFrame(draw);
}
draw();
// 타닥타닥 sound (noise crackle)
let ac,on=false,timer;
function crackle(){
  const len=ac.sampleRate*R(.01,.05),b=ac.createBuffer(1,len,ac.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);
  const s=ac.createBufferSource(),gn=ac.createGain();gn.gain.value=R(.1,.5);
  s.buffer=b;s.connect(gn).connect(ac.destination);s.start();
  timer=setTimeout(crackle,R(30,400)/fuel);
}
document.getElementById('snd').onclick=e=>{
  if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();
  on=!on;clearTimeout(timer);if(on)crackle();
  e.target.textContent=on?'🔇 소리 끄기':'🔊 타닥타닥 소리';
};
document.getElementById('wood').onclick=()=>{fuel=1.4};
// hide UI when idle
const ui=document.getElementById('ui');let t;
function show(){ui.classList.remove('hide');clearTimeout(t);t=setTimeout(()=>ui.classList.add('hide'),4000)}
['mousemove','touchstart','click'].forEach(e=>addEventListener(e,show));show();
</script>
</body>
</html>
