<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>지니의 하루</title>
<style>
  :root { --ink:#2a2220; --paper:#fff; --bg:#ececec; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif; }
  main { max-width:480px; margin:0 auto; background:var(--paper); padding:0 0 32px; }
  header { padding:28px 16px 18px; text-align:center; }
  header h1 { margin:0; font-size:28px; letter-spacing:-.02em; }
  header p { margin:6px 0 0; font-size:14px; opacity:.65; }
  svg { display:block; width:100%; height:auto; margin:10px 0; }
  footer { text-align:center; font-size:14px; opacity:.6; padding-top:12px; }
  .t { font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif; fill:var(--ink); }
</style>
</head>
<body>
<main>
<header>
  <h1>지니의 하루</h1>
  <p>1화 · 평범한 하루</p>
</header>

<svg viewBox="0 0 480 420" role="img" aria-label="컷1: 아침, 알람이 울리는데 이불 속에서 5분만 더 하는 지니">
  <defs>
    <clipPath id="c1"><rect width="480" height="420"/></clipPath>
    <g id="head">
      <g fill="#3b2a25">
        <circle cx="-48" cy="-30" r="26"/><circle cx="-30" cy="-58" r="28"/><circle cx="0" cy="-66" r="30"/>
        <circle cx="30" cy="-58" r="28"/><circle cx="48" cy="-30" r="26"/>
        <circle cx="-56" cy="0" r="22"/><circle cx="56" cy="0" r="22"/>
        <circle cx="-52" cy="24" r="18"/><circle cx="52" cy="24" r="18"/>
      </g>
      <ellipse cx="-51" cy="8" rx="6" ry="10" fill="#ffe1c6" stroke="#8a5a44" stroke-width="2"/>
      <ellipse cx="51" cy="8" rx="6" ry="10" fill="#ffe1c6" stroke="#8a5a44" stroke-width="2"/>
      <ellipse cx="0" cy="5" rx="50" ry="56" fill="#ffe1c6" stroke="#8a5a44" stroke-width="2.5"/>
      <g fill="#3b2a25">
        <circle cx="-34" cy="-38" r="16"/><circle cx="-12" cy="-46" r="17"/><circle cx="12" cy="-46" r="17"/>
        <circle cx="34" cy="-38" r="16"/><circle cx="-46" cy="-18" r="12"/><circle cx="46" cy="-18" r="12"/>
      </g>
      <ellipse cx="-31" cy="26" rx="11" ry="6" fill="#ff9d94" opacity=".55"/>
      <ellipse cx="31" cy="26" rx="11" ry="6" fill="#ff9d94" opacity=".55"/>
      <path d="M-3 14 q3 5 6 0" fill="none" stroke="#8a5a44" stroke-width="2" stroke-linecap="round"/>
    </g>
    <g id="body">
      <path d="M-55 0 Q-72 24 -64 112 L64 112 Q72 24 55 0 Q0 22 -55 0Z" fill="#f08a9b" stroke="#a24b5d" stroke-width="2.5"/>
      <g fill="#fff" opacity=".85">
        <circle cx="-32" cy="34" r="5"/><circle cx="10" cy="50" r="5"/><circle cx="38" cy="28" r="5"/>
        <circle cx="-14" cy="82" r="5"/><circle cx="34" cy="92" r="5"/><circle cx="-44" cy="88" r="5"/>
      </g>
      <rect x="-14" y="-10" width="28" height="18" fill="#ffe1c6"/>
    </g>
  </defs>
  <g clip-path="url(#c1)">
    <rect width="480" height="420" fill="#fff3d1"/>
    <!-- window -->
    <rect x="330" y="30" width="120" height="130" rx="6" fill="#bfe3ff" stroke="#2a2220" stroke-width="3"/>
    <line x1="390" y1="30" x2="390" y2="160" stroke="#2a2220" stroke-width="3"/>
    <circle cx="360" cy="62" r="16" fill="#ffd34d"/>
    <!-- nightstand + clock -->
    <rect x="360" y="270" width="110" height="150" fill="#b98a5e" stroke="#2a2220" stroke-width="3"/>
    <g transform="translate(415 235)">
      <circle r="30" fill="#ff6b6b" stroke="#2a2220" stroke-width="3"/>
      <circle r="21" fill="#fff"/>
      <path d="M0 0V-14M0 0L9 5" stroke="#2a2220" stroke-width="3" stroke-linecap="round"/>
      <circle cx="-22" cy="-30" r="8" fill="#ffd34d" stroke="#2a2220" stroke-width="2"/>
      <circle cx="22" cy="-30" r="8" fill="#ffd34d" stroke="#2a2220" stroke-width="2"/>
      <path d="M-44 -14l-12-6M-46 4h-14M44 -14l12-6M46 4h14" stroke="#e03030" stroke-width="3" stroke-linecap="round"/>
    </g>
    <text class="t" x="352" y="168" font-size="18" font-weight="800" fill="#e03030" style="fill:#e03030" transform="rotate(-8 352 168)">따르르릉!</text>
    <!-- bed -->
    <rect x="0" y="250" width="380" height="170" fill="#cfe3ff" stroke="#2a2220" stroke-width="3"/>
    <rect x="30" y="226" width="170" height="64" rx="28" fill="#fff" stroke="#2a2220" stroke-width="3"/>
    <!-- Jini head, bed hair -->
    <g transform="translate(120 215) rotate(-12)">
      <path d="M-20 -88l-6-22M0 -96v-26M22 -88l8-22M-44 -70l-16-14" stroke="#3b2a25" stroke-width="5" stroke-linecap="round"/>
      <use href="#head"/>
      <path d="M-34 -2q10 8 20 0M14 -2q10 8 20 0" fill="none" stroke="#2a2220" stroke-width="3.5" stroke-linecap="round"/>
      <ellipse cx="0" cy="34" rx="8" ry="6" fill="#c0504d" stroke="#2a2220" stroke-width="2"/>
    </g>
    <!-- blanket -->
    <path d="M190 262q40-24 90-6t100 0V420H170Q160 330 190 262Z" fill="#8fb9f2" stroke="#2a2220" stroke-width="3"/>
    <path d="M230 300q20 14 40 0t40 0M220 350q20 14 40 0t40 0" fill="none" stroke="#fff" stroke-width="3" opacity=".7" stroke-linecap="round"/>
    <!-- bubble -->
    <g>
      <ellipse cx="170" cy="82" rx="102" ry="36" fill="#fff" stroke="#2a2220" stroke-width="3"/>
      <path d="M148 114l-6 22 26-20Z" fill="#fff" stroke="#2a2220" stroke-width="3" stroke-linejoin="round"/>
      <path d="M143 112q12 6 26 2" stroke="#fff" stroke-width="5" fill="none"/>
      <text class="t" x="170" y="90" font-size="24" font-weight="700" text-anchor="middle">5분만 더…</text>
    </g>
    <text class="t" x="270" y="215" font-size="22" font-weight="800" fill="#6a7fb5" style="fill:#6a7fb5">z Z z</text>
    <!-- narration -->
    <rect x="10" y="10" width="112" height="30" fill="#fff" stroke="#2a2220" stroke-width="2.5"/>
    <text class="t" x="66" y="31" font-size="15" font-weight="700" text-anchor="middle">오전 6:30</text>
  </g>
  <rect x="1.5" y="1.5" width="477" height="417" fill="none" stroke="#2a2220" stroke-width="3"/>
</svg>

<svg viewBox="0 0 480 420" role="img" aria-label="컷2: 마트에서 1+1 행사를 보고 눈이 반짝이는 지니">
  <defs><clipPath id="c2"><rect width="480" height="420"/></clipPath></defs>
  <g clip-path="url(#c2)">
    <rect width="480" height="420" fill="#e8f3ff"/>
    <!-- shelves -->
    <rect x="0" y="120" width="480" height="8" fill="#9aa7b8"/>
    <rect x="0" y="240" width="480" height="8" fill="#9aa7b8"/>
    <g stroke="#2a2220" stroke-width="2">
      <rect x="10" y="80" width="36" height="40" fill="#ffb74d"/><rect x="50" y="70" width="30" height="50" fill="#81c784"/>
      <rect x="84" y="86" width="40" height="34" fill="#64b5f6"/><rect x="130" y="74" width="34" height="46" fill="#f06292"/>
      <rect x="10" y="200" width="40" height="40" fill="#fff176"/><rect x="54" y="190" width="34" height="50" fill="#ba68c8"/>
      <rect x="92" y="204" width="40" height="36" fill="#ff8a65"/><rect x="138" y="196" width="30" height="44" fill="#4db6ac"/>
      <rect x="360" y="86" width="40" height="34" fill="#ffb74d"/><rect x="406" y="74" width="34" height="46" fill="#81c784"/>
      <rect x="440" y="90" width="34" height="30" fill="#64b5f6"/>
      <rect x="370" y="200" width="36" height="40" fill="#f06292"/><rect x="410" y="190" width="40" height="50" fill="#fff176"/>
    </g>
    <!-- 1+1 sign -->
    <g transform="translate(215 70) rotate(-8)">
      <polygon points="0,-34 11,-18 30,-26 28,-6 48,0 30,10 38,28 18,24 8,40 -2,22 -22,32 -22,12 -42,8 -26,-4 -34,-22 -14,-18" fill="#ff3b3b" stroke="#2a2220" stroke-width="3" stroke-linejoin="round"/>
      <text class="t" x="2" y="10" font-size="28" font-weight="900" text-anchor="middle" style="fill:#fff">1+1</text>
    </g>
    <!-- floor -->
    <rect x="0" y="360" width="480" height="60" fill="#d9dfe8"/>
    <!-- Jini -->
    <g transform="translate(300 175)">
      <!-- pants -->
      <path d="M-62 270L-70 420H-6L0 300L6 420H70L62 270Z" fill="#6b5b95" stroke="#2a2220" stroke-width="2.5"/>
      <use href="#body" y="60"/>
      <use href="#head"/>
      <!-- sparkly eyes -->
      <g stroke="#2a2220" stroke-width="2.5">
        <circle cx="-22" cy="0" r="12" fill="#fff"/><circle cx="22" cy="0" r="12" fill="#fff"/>
      </g>
      <g fill="#ffb300" stroke="#2a2220" stroke-width="1.5" stroke-linejoin="round">
        <path d="M-22 -9l3 6 7 1-5 5 1 7-6-3-6 3 1-7-5-5 7-1Z"/>
        <path d="M22 -9l3 6 7 1-5 5 1 7-6-3-6 3 1-7-5-5 7-1Z"/>
      </g>
      <path d="M-14 32q14 18 28 0Z" fill="#c0504d" stroke="#2a2220" stroke-width="2.5" stroke-linejoin="round"/>
      <!-- arm pointing up to sign -->
      <path d="M-50 70L-100 -2" stroke="#f08a9b" stroke-width="26" stroke-linecap="round"/>
      <circle cx="-104" cy="-8" r="13" fill="#ffe1c6" stroke="#8a5a44" stroke-width="2.5"/>
      <!-- arm with basket -->
      <path d="M50 70L72 160" stroke="#f08a9b" stroke-width="26" stroke-linecap="round"/>
      <circle cx="74" cy="168" r="13" fill="#ffe1c6" stroke="#8a5a44" stroke-width="2.5"/>
      <path d="M52 168q22-34 44 0" fill="none" stroke="#2a2220" stroke-width="4"/>
      <path d="M40 166h72l-10 54H50Z" fill="#9ccc65" stroke="#2a2220" stroke-width="3" stroke-linejoin="round"/>
      <path d="M52 182h48M56 198h40" stroke="#2a2220" stroke-width="2" opacity=".5"/>
    </g>
    <!-- bubble -->
    <g>
      <rect x="10" y="150" width="190" height="62" rx="26" fill="#fff" stroke="#2a2220" stroke-width="3"/>
      <path d="M180 196l36 18-44-4Z" fill="#fff" stroke="#2a2220" stroke-width="3" stroke-linejoin="round"/>
      <path d="M176 200l34 12-34-2Z" fill="#fff"/>
      <text class="t" x="105" y="190" font-size="22" font-weight="700" text-anchor="middle">어머, 1+1이네!</text>
    </g>
    <!-- thought -->
    <circle cx="26" cy="286" r="5" fill="#fff" stroke="#2a2220" stroke-width="2"/>
    <circle cx="44" cy="270" r="8" fill="#fff" stroke="#2a2220" stroke-width="2"/>
    <ellipse cx="108" cy="250" rx="62" ry="22" fill="#fff" stroke="#2a2220" stroke-width="2.5" stroke-dasharray="5 4"/>
    <text class="t" x="108" y="256" font-size="14" text-anchor="middle">집에 있긴 한데…</text>
    <rect x="10" y="10" width="140" height="30" fill="#fff" stroke="#2a2220" stroke-width="2.5"/>
    <text class="t" x="80" y="31" font-size="15" font-weight="700" text-anchor="middle">오후 2:00 · 마트</text>
  </g>
  <rect x="1.5" y="1.5" width="477" height="417" fill="none" stroke="#2a2220" stroke-width="3"/>
</svg>

<svg viewBox="0 0 480 420" role="img" aria-label="컷3: 남편의 저녁 메뉴 문자에 무표정으로 답하는 지니">
  <defs><clipPath id="c3"><rect width="480" height="420"/></clipPath></defs>
  <g clip-path="url(#c3)">
    <rect width="480" height="420" fill="#fbeedd"/>
    <!-- kitchen wall tiles -->
    <g stroke="#e6d3bc" stroke-width="2">
      <path d="M0 60H480M0 120H480M0 180H480M0 240H480M0 300H480M0 360H480"/>
      <path d="M60 0V420M180 0V420M300 0V420M420 0V420"/>
    </g>
    <g transform="translate(150 160)">
      <use href="#body" y="60"/>
      <use href="#head"/>
      <!-- half-lidded eyes -->
      <g>
        <circle cx="-22" cy="2" r="11" fill="#fff" stroke="#2a2220" stroke-width="2.5"/>
        <circle cx="22" cy="2" r="11" fill="#fff" stroke="#2a2220" stroke-width="2.5"/>
        <circle cx="-22" cy="5" r="4" fill="#2a2220"/><circle cx="22" cy="5" r="4" fill="#2a2220"/>
        <path d="M-35 -4h26M9 -4h26" stroke="#2a2220" stroke-width="4" stroke-linecap="round"/>
      </g>
      <path d="M-12 34h24" stroke="#2a2220" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M-30 -28v14M-20 -30v14M-10 -31v14" stroke="#8a5a44" stroke-width="2.5" stroke-linecap="round" opacity=".7"/>
      <!-- arm holding phone -->
      <path d="M52 70L112 100" stroke="#f08a9b" stroke-width="26" stroke-linecap="round"/>
    </g>
    <!-- phone -->
    <g transform="translate(262 60) rotate(4)">
      <rect width="190" height="330" rx="22" fill="#2a2220"/>
      <rect x="8" y="14" width="174" height="302" rx="14" fill="#b9d3ee"/>
      <rect x="8" y="14" width="174" height="34" rx="14" fill="#8fb4da"/>
      <text class="t" x="95" y="36" font-size="14" font-weight="700" text-anchor="middle">남편</text>
      <!-- messages -->
      <g>
        <rect x="18" y="62" width="128" height="34" rx="12" fill="#fff"/>
        <text class="t" x="28" y="84" font-size="13">여보 저녁 뭐야?</text>
        <rect x="18" y="106" width="150" height="34" rx="12" fill="#fff"/>
        <text class="t" x="28" y="128" font-size="13">맛있는 거 해줘 ㅎㅎ</text>
        <rect x="18" y="150" width="150" height="34" rx="12" fill="#fff"/>
        <text class="t" x="28" y="172" font-size="13">대파도 좀 사다 줘~</text>
        <rect x="44" y="204" width="126" height="34" rx="12" fill="#fee500"/>
        <text class="t" x="54" y="226" font-size="13">냉장고에 있는 거.</text>
        <text class="t" x="150" y="256" font-size="10" text-anchor="end" opacity=".6">읽음</text>
      </g>
    </g>
    <circle cx="262" cy="196" r="14" fill="#ffe1c6" stroke="#8a5a44" stroke-width="2.5"/>
    <!-- thought -->
    <circle cx="76" cy="148" r="5" fill="#fff" stroke="#2a2220" stroke-width="2"/>
    <circle cx="62" cy="128" r="8" fill="#fff" stroke="#2a2220" stroke-width="2"/>
    <ellipse cx="96" cy="84" rx="76" ry="36" fill="#fff" stroke="#2a2220" stroke-width="2.5" stroke-dasharray="5 4"/>
    <text class="t" x="96" y="80" font-size="14" text-anchor="middle">또 시작이네,</text>
    <text class="t" x="96" y="100" font-size="14" text-anchor="middle">저녁 걱정…</text>
    <rect x="10" y="10" width="112" height="30" fill="#fff" stroke="#2a2220" stroke-width="2.5"/>
    <text class="t" x="66" y="31" font-size="15" font-weight="700" text-anchor="middle">오후 5:00</text>
  </g>
  <rect x="1.5" y="1.5" width="477" height="417" fill="none" stroke="#2a2220" stroke-width="3"/>
</svg>

<svg viewBox="0 0 480 420" role="img" aria-label="컷4: 밤, 소파에 앉아 오늘도 수고했다고 중얼거리는 지니">
  <defs>
    <clipPath id="c4"><rect width="480" height="420"/></clipPath>
    <radialGradient id="glow" cx="75%" cy="25%" r="70%">
      <stop offset="0" stop-color="#6fa8ff" stop-opacity=".55"/><stop offset="1" stop-color="#6fa8ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g clip-path="url(#c4)">
    <rect width="480" height="420" fill="#2c3050"/>
    <rect width="480" height="420" fill="url(#glow)"/>
    <!-- TV -->
    <rect x="320" y="40" width="150" height="100" rx="6" fill="#111" stroke="#9aa0c0" stroke-width="3"/>
    <rect x="328" y="48" width="134" height="84" fill="#8fc2ff"/>
    <circle cx="372" cy="86" r="14" fill="#ffe08a"/><path d="M340 132q30-30 60 0Z" fill="#6fcf8f"/>
    <!-- sofa -->
    <rect x="0" y="230" width="330" height="190" rx="24" fill="#c97b63" stroke="#2a2220" stroke-width="3"/>
    <rect x="-10" y="270" width="60" height="150" rx="20" fill="#b46850" stroke="#2a2220" stroke-width="3"/>
    <!-- Jini -->
    <g transform="translate(170 175)">
      <path d="M-60 250L-64 330H64L60 250Z" fill="#6b5b95" stroke="#2a2220" stroke-width="2.5"/>
      <use href="#body" y="60"/>
      <use href="#head" transform="rotate(6)"/>
      <!-- closed smile eyes, tired -->
      <g transform="rotate(6)">
        <path d="M-34 4q12-14 24 0M10 4q12-14 24 0" fill="none" stroke="#2a2220" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M-14 30q14 14 28 0" fill="none" stroke="#2a2220" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M-40 -20l-8 -6M40 -20l8 -6" stroke="#8a5a44" stroke-width="2" opacity="0"/>
      </g>
      <!-- arm holding remote -->
      <path d="M52 78L108 150" stroke="#f08a9b" stroke-width="26" stroke-linecap="round"/>
      <circle cx="112" cy="156" r="13" fill="#ffe1c6" stroke="#8a5a44" stroke-width="2.5"/>
      <rect x="104" y="140" width="14" height="38" rx="4" fill="#333" transform="rotate(25 111 159)"/>
      <!-- snack bowl on lap -->
      <path d="M-62 200h62l-10 28h-42Z" fill="#fff" stroke="#2a2220" stroke-width="2.5" stroke-linejoin="round"/>
      <g fill="#ffb74d" stroke="#2a2220" stroke-width="1.5"><circle cx="-46" cy="196" r="7"/><circle cx="-30" cy="192" r="7"/><circle cx="-14" cy="196" r="7"/></g>
    </g>
    <!-- bubble -->
    <g>
      <g transform="translate(0 -22)">
      <ellipse cx="300" cy="196" rx="128" ry="34" fill="#fff" stroke="#2a2220" stroke-width="3" transform="translate(-60 -110)"/>
      <path d="M170 98l-14 28 36-18Z" fill="#fff" stroke="#2a2220" stroke-width="3" stroke-linejoin="round"/>
      <path d="M166 90l22 22-30 6Z" fill="#fff" stroke="none"/>
      <text class="t" x="240" y="94" font-size="20" font-weight="700" text-anchor="middle" transform="translate(-0 0)">오늘도 수고했다, 나.</text>
    </g></g>
    <!-- last thought -->
    <rect x="262" y="332" width="206" height="62" rx="18" fill="#fff" stroke="#2a2220" stroke-width="2.5" stroke-dasharray="5 4"/>
    <circle cx="256" cy="322" r="5" fill="#fff" stroke="#2a2220" stroke-width="2"/>
    <text class="t" x="365" y="357" font-size="15" text-anchor="middle">…근데 내일 반찬</text>
    <text class="t" x="365" y="378" font-size="15" text-anchor="middle">뭐 하지?</text>
    <rect x="10" y="10" width="112" height="30" fill="#fff" stroke="#2a2220" stroke-width="2.5"/>
    <text class="t" x="66" y="31" font-size="15" font-weight="700" text-anchor="middle">밤 10:00</text>
  </g>
  <rect x="1.5" y="1.5" width="477" height="417" fill="none" stroke="#2a2220" stroke-width="3"/>
</svg>

<footer>— 1화 끝 —</footer>
</main>
</body>
</html>
