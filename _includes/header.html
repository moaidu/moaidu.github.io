<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="{{ '/' | relative_url }}">
      <img src="{{ '/assets/img/moaidu-logo.svg' | relative_url }}" alt="모아이듀 MOAIDU">
      <span>{{ site.title }}</span>
    </a>
    <nav class="nav">
      {% for c in site.data.categories %}
      <a href="{{ '/category/' | append: c.slug | append: '/' | relative_url }}"
         {% if page.url contains c.slug %}class="active"{% endif %}>{{ c.name }}</a>
      {% endfor %}
      <a href="{{ '/experience/' | relative_url }}" {% if page.url contains '/experience' %}class="active"{% endif %}>🧭 체험 레이더</a>
      <a href="{{ '/about/' | relative_url }}" {% if page.url contains '/about' %}class="active"{% endif %}>소개</a>
    </nav>
  </div>
</header>
